<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1846" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Scan a toy, build printable upgrades on it, and play with it in a mini game." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Installed to the home screen (a web app, not a store app). iOS ignores the manifest's icons, so it gets its own 180 px PNG (scripts/gen-pwa-icons.mjs makes it); the
         three meta tags make the home-screen icon open full screen with a solid status bar and the right name on iOS and on older Android browsers. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ToyVentor" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>ToyVentor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
