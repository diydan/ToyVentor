<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fig 1 — Parallax image backdrops (mockup, not shipped)</title>
<style>
  :root { --ink:#e8ecff; --mut:#9aa8e8; --gold:#ffd24d; --card:#101a44; }
  * { box-sizing: border-box; }
  body { margin:0; background:#070d2b; color:var(--ink); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border:1px solid rgba(255,255,255,.18); border-radius:16px; overflow:hidden; }
  header { display:flex; justify-content:space-between; gap:12px; padding:10px 14px 0; }
  header .fig { color: var(--gold); font-weight:700; letter-spacing:.04em; }
  header .ttl { color: var(--mut); }
  #view { position:relative; height: 520px; }
  canvas { display:block; width:100%; height:100%; }
  .bar { display:flex; flex-wrap:wrap; gap:14px; align-items:center; padding:10px 14px 12px; border-top:1px solid rgba(255,255,255,.12); }
  .bar label { display:flex; gap:8px; align-items:center; color:var(--mut); font-size:13px; }
  .bar input[type=range] { width: 180px; accent-color: var(--gold); }
  .bar button { background:#1b2a6e; color:var(--ink); border:1px solid rgba(255,255,255,.3); border-radius:10px; padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .bar button[aria-pressed=true] { border-color: var(--gold); color: var(--gold); }
  .themes { display:flex; gap:8px; padding:10px 14px 0; flex-wrap:wrap; }
  .themes button { background:#1b2a6e; color:var(--ink); border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:6px 14px; font:inherit; font-size:13px; cursor:pointer; }
  .themes button[aria-pressed=true] { border-color: var(--gold); color: var(--gold); background:#26368a; }
  .seg { display:flex; gap:6px; align-items:center; color:var(--mut); font-size:13px; }
  .seg button { padding:6px 10px; }
  .seg button:disabled { cursor:not-allowed; }
  #readout { margin-left:auto; font-variant-numeric: tabular-nums; color: var(--gold); font-size:13px; }
  .legend { padding: 10px 14px 14px; color: var(--mut); font-size: 13.5px; }
  .legend b { color: var(--ink); }
  code { color: var(--gold); }
  @media (max-width: 640px) { #view { height: 420px; } }
</style>
</head>
<body>
<main>
  <figure class="card" style="margin:0">
    <header><span class="fig">FIG 1</span><span class="ttl" id="ttl">Parallax image backdrops</span></header>
    <div class="themes" id="themes" role="group" aria-label="Theme"></div>
    <div id="view" aria-label="Interactive mockup: drag the camera slider to pan along the lane"></div>
    <div class="bar">
      <label>Camera x <input id="camx" type="range" min="3" max="41" step="0.1" value="8"></label>
      <label>Explode <input id="explode" type="range" min="0" max="1" step="0.01" value="0"></label>
      <label>Path <input id="pathw" type="range" min="2.2" max="3.8" step="0.05" value="3"></label>
      <label>Mid size <input id="midfit" type="range" min="0.6" max="1.3" step="0.02" value="0.86"></label>
      <button id="planes" aria-pressed="true">Image planes</button>
      <button id="fog" aria-pressed="true">Fog</button>
      <button id="motion" aria-pressed="true">Auto-pan</button>
      <span id="readout" role="status">—</span>
    </div>
    <figcaption class="legend" id="legend"></figcaption>
  </figure>
</main>

    wrap(x, y, rad, (X, Y) => { const gr = g.createRadialGradient(X, Y, 0, X, Y, rad);
      gr.addColorStop(0, `rgba(${col},0.30)`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.fillRect(X - rad, Y - rad, rad * 2, rad * 2); }); }

}
function makeDirt(p) {           // 512 px = 6 world units

  g.fillStyle = p.base; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 70; i++) { const x = r() * S, y = r() * S, rad = 18 + r() * 50, col = r() < 0.5 ? p.blobA : p.blobB;
    wrap(x, y, rad, (X, Y) => { const gr = g.createRadialGradient(X, Y, 0, X, Y, rad);
      gr.addColorStop(0, `rgba(${col},0.22)`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.fillRect(X - rad, Y - rad, rad * 2, rad * 2); }); }

    wrap(x, y, rr_ * 1.4, (X, Y) => { g.fillStyle = fill; g.beginPath(); g.ellipse(X, Y, rr_ * 1.3, rr_, ang, 0, Math.PI * 2); g.fill(); }); }

    const y0 = i * ph, tone = 0.5 + (r() - 0.5) * 0.55;
    g.fillStyle = `rgb(${(B[0] + tone * SP[0]) | 0},${(B[1] + tone * SP[1]) | 0},${(B[2] + tone * SP[2]) | 0})`; g.fillRect(0, y0, S, ph);
    for (let k = 0; k < 18; k++) { const yy = y0 + 4 + r() * (ph - 8), len = 140 + r() * 400, x = r() * S, a = 0.05 + r() * 0.1, dark = r() < 0.6,
        w1 = (r() - 0.5) * 3, w2 = (r() - 0.5) * 3, lw = 1 + r() * 2;
      g.strokeStyle = dark ? `rgba(70,40,20,${a})` : `rgba(235,185,125,${a})`; g.lineWidth = lw;
      for (const dx of [-S, 0, S]) { g.beginPath(); g.moveTo(x + dx, yy); g.bezierCurveTo(x + dx + len * 0.3, yy + w1, x + dx + len * 0.6, yy + w2, x + dx + len, yy); g.stroke(); } }

    if (r() < 0.4) { const kx = r() * S, ky = y0 + ph * (0.3 + r() * 0.4); g.fillStyle = "rgba(60,34,18,0.35)"; g.beginPath(); g.ellipse(kx, ky, 9, 5, 0, 0, 7); g.fill();
      g.strokeStyle = "rgba(60,34,18,0.25)"; g.lineWidth = 1; g.beginPath(); g.ellipse(kx, ky, 15, 8, 0, 0, 7); g.stroke(); }
    g.fillStyle = "rgba(35,20,10,0.6)"; g.fillRect(0, y0 + ph - 2, S, 2); g.fillStyle = "rgba(255,230,190,0.12)"; g.fillRect(0, y0, S, 1);
  }

    g.fillStyle = "rgba(90,50,20,0.05)"; g.beginPath(); g.arc(x, y, rad - 3, 0, 7); g.fill(); }

function makeRug(p = {}) {       // runner: 1024x512 px = 6 x 3 world units (square texels at the default path width of 3.0)

  band(0, 46, A); band(46, 8, CR); band(62, 10, DK); band(H - 46, 46, A); band(H - 54, 8, CR); band(H - 72, 10, DK);
  for (let x = 0; x < W; x += 32) { g.fillStyle = GD; g.fillRect(x + 4, 18, 14, 10); g.fillRect(x + 4, H - 28, 14, 10); }          // border dashes
  const diamond = (cx, cy, hw, hh, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(cx, cy - hh); g.lineTo(cx + hw, cy); g.lineTo(cx, cy + hh); g.lineTo(cx - hw, cy); g.closePath(); g.fill(); };
  for (let i = 0; i < 4; i++) { const cx = 128 + i * 256, cy = H / 2;                                                                 // 4 motifs = seamless in x
    diamond(cx, cy, 118, 150, GD); diamond(cx, cy, 98, 126, A); diamond(cx, cy, 70, 90, CR); diamond(cx, cy, 44, 56, F); diamond(cx, cy, 16, 20, GD);
    g.fillStyle = A; g.beginPath(); g.arc(cx + 128, cy, 14, 0, 7); g.fill(); g.fillStyle = GD; g.beginPath(); g.arc(cx + 128, cy, 6, 0, 7); g.fill(); }

// ================================================================================================================
// TOY ROOM, ported from the main game (src/features/game/world/runtime: world.ts roomWall/rug/plankTex/props, worldScene.ts
// plastic/metal/rbox/environment, lighting.ts LIGHT_RIGS.room, catalog.ts level "room"). Geometry and colours are copied, not imitated.
// ================================================================================================================
const gPlastic = (c, o) => new T.MeshPhysicalMaterial({ color: c, roughness: 0.34, metalness: 0, clearcoat: 0.85, clearcoatRoughness: 0.16, ...(o || {}) });

const gG = (...o) => { const g = new T.Group(); o.forEach((k) => g.add(k)); return g; };
const gCapsule = (r, len, mat) => gG(gM(new T.CylinderGeometry(r, r, len, 16), mat), gM(new T.SphereGeometry(r, 16, 12), mat, 0, len / 2, 0), gM(new T.SphereGeometry(r, 16, 12), mat, 0, -len / 2, 0));
function gRbox(w, h, d, r) { const b = Math.min(r, 0.45 * Math.min(w, h, d)), sw = w - 2 * b, sh = h - 2 * b, cr = Math.max(0.001, Math.min(b, sw / 2, sh / 2) * 0.9), s = new T.Shape(), x = -sw / 2, y = -sh / 2;

  s.lineTo(x + cr, y + sh); s.quadraticCurveTo(x, y + sh, x, y + sh - cr); s.lineTo(x, y + cr); s.quadraticCurveTo(x, y, x + cr, y);
  const dd = Math.max(0.001, d - 2 * b), g = new T.ExtrudeGeometry(s, { depth: dd, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 6, curveSegments: 10 }); g.translate(0, 0, -dd / 2); return g; }
function gGlowTex(col) { const c = mk(128, 128), g = c.getContext("2d"), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, col); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t; }

function gLetterMat(ch, bg) { const c = mk(128, 128), g = c.getContext("2d"); g.fillStyle = bg; g.fillRect(0, 0, 128, 128); g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 8; g.strokeRect(10, 10, 108, 108);

  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return new T.MeshPhysicalMaterial({ map: t, roughness: 0.35, clearcoat: 0.8 }); }
function makePlanks() {          // game plankTex(): 512 px, 8 rows of 340 px boards, repeat (7,3) over the 80x34 floor
  const c = mk(512, 512), g = c.getContext("2d"), sh = ["#8a5a34", "#9a6a40", "#a8784a", "#93613a", "#b08050", "#9e6c42"];
  for (let r = 0; r < 8; r++) { const y = r * 64, off = (r % 2) * 170 + ((r * 97) % 60);

      for (let q = 0; q < 14; q++) { g.strokeStyle = "rgba(60,30,10," + (0.06 + ((q * 7) % 5) * 0.02) + ")"; g.lineWidth = 1 + (q % 3); g.beginPath(); const yy = y + 4 + ((q * 37) % 56);
        g.moveTo(x, yy); g.bezierCurveTo(x + 110, yy + ((q % 2) ? 3 : -3), x + 230, yy + ((q % 3) - 1) * 4, x + 340, yy); g.stroke(); }

}
function gEnvironment(p, k) {    // game setEnvironment(): a box room with four coloured light panels, prefiltered (PMREM); ROOM_ENV palette
  const pm = new T.PMREMGenerator(renderer), es = new T.Scene();
  es.add(new T.Mesh(new T.BoxGeometry(20, 12, 20), new T.MeshBasicMaterial({ color: p.bg, side: T.BackSide })));

const gProps = {                 // game props: roomLamp / toyBlocks / bookStack / kidChair / potPlant / teddyBear / playBall / cushionPile

    [[-0.45, -0.38], [0.45, -0.38], [-0.45, 0.38], [0.45, 0.38]].forEach((l) => g.add(gM(new T.CylinderGeometry(0.06, 0.06, 0.85, 10), wood, l[0], 0.42, l[1]))); g.add(gM(gRbox(0.9, 0.1, 0.8, 0.04), gPlastic("#52b7ff", { roughness: 0.8 }), 0, 0.94, 0)); scene.add(g); return g; },

    const leaf = gPlastic("#3fbf72", { roughness: 0.75 }); [[-0.25, 1.15, 0, 0.42], [0.28, 1.3, -0.1, 0.5], [0, 1.6, 0.08, 0.46], [0.05, 1.05, 0.28, 0.34]].forEach((b) => g.add(gM(new T.SphereGeometry(b[3], 14, 10), leaf, b[0], b[1], b[2])));
    g.add(gM(new T.CylinderGeometry(0.05, 0.07, 0.6, 8), gPlastic("#2e8f57"), 0, 0.85, 0)); scene.add(g); return g; },
  teddy(x, z) { const g = new T.Group(); g.position.set(x, 0, z); const fur = gPlastic("#c98d5a", { roughness: 0.9 }), cream = gPlastic("#f2d8b8", { roughness: 0.9 });

// fallback: today's hills (two sphere rows, matte) — visible when planes off
const hillsG = new T.Group(); scene.add(hillsG);
for (const [x, y, z, s] of [[-10,-3,-22,16],[14,-4,-26,18],[38,-3,-22,15],[60,-4,-26,18],[0,-6,-44,30],[40,-6,-46,32],[80,-6,-44,30]]) {
  const m = new T.Mesh(new T.SphereGeometry(1, 16, 10), matte(TH.hills));
  m.position.set(x, y, z); m.scale.set(s, s * 0.42, s * 0.6); hillsG.add(m);
}
hillsG.visible = false;

// lane props at z=0 (gameplay stays 3D)
const place = (grp, x, z) => { grp.position.set(x, 0, z); scene.add(grp); };
if (TH.props === "garden") {
  const pc = TH.pc;
  const lantern = (x) => { const g = new T.Group();
    const pole = new T.Mesh(new T.CylinderGeometry(0.09, 0.11, 3.2, 8), matte(pc.pole)); pole.position.y = 1.6; g.add(pole);

  buildNativeRoom();
}
const hero = new T.Group();
const body = new T.Mesh(new T.CapsuleGeometry(0.55, 1.1, 6, 12), matte(0xf2b93c)); body.position.y = 1.35; hero.add(body);
const head = new T.Mesh(new T.SphereGeometry(0.55, 14, 12), matte(0xffd24d)); head.position.y = 2.55; hero.add(head);

const propsG = new T.Group(); scene.add(propsG);   // ?clean=1 hides props + toy so a backdrop layer can be measured alone

// ================================================================================================================
// backdrop image planes
// ================================================================================================================
// The key fact: the camera is pitched down ~21deg, so the backdrop is only ever seen through a THIN slice of each plane:
// top edge = the screen's top ray, bottom edge = the ray over the ground slab's far edge (z -10, y 0). Art is sized and placed
// from the slice, ALWAYS with a uniform scale (never stretched), base on the ground line.
const planesG = new T.Group(); scene.add(planesG);
const PITCH = Math.atan((CAM_Y - LOOK_Y) / CAM_Z), HALF = (FOV / 2) * Math.PI / 180, SLAB_EDGE_Z = -10;
function slice(z) {

}
// f = scroll factor: plane.x = laneMid + f*(camx-laneMid): the plane need not span the whole lane, so one undistorted image covers it.
// Parallax modes (per theme default; ?speed=full|slow|none): `f` is how much a layer follows the camera (1 = pinned = no parallax).
const SPEED_KEY = ["full", "slow", "none"].includes(QS.get("speed")) ? QS.get("speed") : (TH.speed || "full");
const F_SPEED = { slow: { far: 0.97, mid: 0.92 }, none: { far: 1, mid: 1 } };
const IMAGES = TH.merge && QS.get("images") === "1" ? 1 : 2;           // ?images=1 merges wall + furniture into ONE layer (indoor themes only)
function mergeLayers(far, mid) {
  // Both layers at the screen scale they had as separate layers, bottom-aligned on the floor line; the wall is mirror-tiled to the furniture's width.
  const wall = far.make(), stuff = mid.make(), Hb = Math.round(stuff.height / mid.fitFrac), out = mk(stuff.width, Hb), g = out.getContext("2d");
  const sc = Hb * far.fitFrac / wall.height, dw = wall.width * sc, dh = wall.height * sc;
  for (let i = 0, x = 0; x < out.width; i++, x += dw) { g.save(); if (i % 2) { g.translate(x + dw, Hb - dh); g.scale(-1, 1); g.drawImage(wall, 0, 0, dw, dh); } else g.drawImage(wall, x, Hb - dh, dw, dh); g.restore(); }

let layerDefs = TH.layers;
if (IMAGES === 1) { const far = layerDefs.find((L) => L.name === "far"), mid = layerDefs.find((L) => L.name === "mid");
  layerDefs = [{ name: "mid", make: () => mergeLayers(far, mid), z: mid.z, f: mid.f, fit: "height", fitFrac: 1.0, tint: 0xffffff }]; }
const LAYERS = layerDefs.map((L) => ({ ...L, f: SPEED_KEY === "full" ? L.f : F_SPEED[SPEED_KEY][L.name], fitFrac: +(QS.get(L.name) ?? L.fitFrac) }));
const LANE_MID = (LANE.lo + LANE.hi) / 2;
for (const L of LAYERS) L.on = !QS.get("layers") || QS.get("layers").split(",").includes(L.name);   // ?layers=far shows one layer
const TUCK = 0.12;   // how far the art's base hides below the ground line so no hairline gap can show

function keyAndCrop(img) {
  // flood-fill the black surround from the border (interior darks survive), erode the dark fringe, crop to the art's bounding box.

// ================================================================================================================
// controls
// ================================================================================================================
const $ = (id) => document.getElementById(id);
document.getElementById("ttl").textContent = TH.title;
document.getElementById("legend").innerHTML = `
  <b>Themes</b> (buttons above, or <code>?theme=night|day|room|library|workshop|desk|toyroom</code>): one config each. Night and Day garden use two image backdrop layers; the five indoor themes use the Toy Room technique. ${TH.notes}<br>
  ${LAYERS.length ? `<b>Parallax</b> (Full / Slower / None) sets how much each layer follows the camera; <b>Images</b> 1 merges the two layers into one.<br>
  <b>How to read it:</b> slide <b>Camera x</b> — two background layers scroll at different rates (far z −34, mid z −22); the lane (z 0) moves 1:1. <b>Explode</b> pulls the camera up and back to show the stack.
  <b>Rules:</b> uniform scale only (no stretch); every layer's base sits on the ground line; each layer follows the camera by a scroll factor (far .85, mid .65); the readout shows each layer's speed relative to the lane. The <b>far / mid</b> buttons hide a layer; <b>Mid size</b> trades how much of the far layer shows against mid-art repeats.
  <b>Ground + path:</b> the ground is a seamless tile; the path is generated (ribbon mesh, one small tile in world coordinates${PATH.stones ? ", instanced stones" : ""}); <b>Path</b> sets its width (default 3.0 = 2.7× the toy) and it stays under the toy, which wanders ±0.8 in z with Auto-pan (<code>?hz=0.8</code> pins it).`
  : `<b>How to read it:</b> slide <b>Camera x</b> to walk the lane; <b>Explode</b> pulls the camera up and back to show how the room is laid out (flat wall on the ground line, props in two rows behind and beside the toy, a few in front). The toy wanders ±0.8 in z with Auto-pan (<code>?hz=0.8</code> pins it). All indoor themes share the Toy Room's technique: no painted backdrop strips, no parallax layers.`}`;
const themesEl = $("themes");
for (const [key, th] of Object.entries(THEMES)) { const b = document.createElement("button"); b.textContent = th.label; b.setAttribute("aria-pressed", String(key === THEME_KEY));
  b.addEventListener("click", () => { const u = new URL(location.href); u.searchParams.set("theme", key); u.searchParams.delete("speed"); u.searchParams.delete("images"); location.href = u.toString(); }); themesEl.appendChild(b); }
const seg = (label, items, cur, param) => { const d = document.createElement("div"); d.className = "seg"; d.append(label);
  for (const [val, text, ok = true] of items) { const b = document.createElement("button"); b.textContent = text; b.setAttribute("aria-pressed", String(val === cur)); b.disabled = !ok;
    if (!ok) { b.style.opacity = 0.4; b.title = "indoor themes only"; }
    b.addEventListener("click", () => { const u = new URL(location.href); u.searchParams.set(param, val); location.href = u.toString(); }); d.appendChild(b); }
  $("readout").before(d); };
if (LAYERS.length) { seg("Parallax", [["full", "Full"], ["slow", "Slower"], ["none", "None"]], SPEED_KEY, "speed");
  seg("Images", [["2", "2"], ["1", "1", !!TH.merge]], String(IMAGES), "images"); }
const Q = QS; // ?cam=16&explode=0&planes=1&fog=1&motion=0&theme=day (deterministic shots)
const state = { camx: +(Q.get("cam") ?? 8), explode: +(Q.get("explode") ?? 0), hz: +(Q.get("hz") ?? 0), planes: Q.get("planes") !== "0", fog: Q.get("fog") !== "0",
  motion: Q.has("motion") ? Q.get("motion") === "1" : !matchMedia("(prefers-reduced-motion: reduce)").matches };

planesG.visible = state.planes; hillsG.visible = !state.planes; if (!state.fog) scene.fog = null;
$("motion").setAttribute("aria-pressed", String(state.motion));
$("camx").addEventListener("input", (e) => { state.camx = +e.target.value; state.motion = false; $("motion").setAttribute("aria-pressed", "false"); });
$("explode").addEventListener("input", (e) => { state.explode = +e.target.value; });
$("pathw").value = PATH.width; { const mid = LAYERS.find((L) => L.name === "mid");
  if (mid) { $("midfit").value = mid.fitFrac; $("midfit").addEventListener("input", (e) => { mid.fitFrac = +e.target.value; layout(); }); } else $("midfit").closest("label").style.display = "none"; }
if (PATH.hidden) $("pathw").closest("label").style.display = "none";
if (!LAYERS.length) $("planes").style.display = "none";
$("pathw").addEventListener("input", (e) => { PATH.width = +e.target.value; buildPath(); });
const toggle = (id, key, fn) => $(id).addEventListener("click", () => { state[key] = !state[key]; $(id).setAttribute("aria-pressed", String(state[key])); fn(state[key]); });
toggle("planes", "planes", (on) => { planesG.visible = on; hillsG.visible = !on; });
toggle("fog", "fog", (on) => { scene.fog = on && TH.fog ? new T.Fog(TH.fog.color, TH.fog.near, TH.fog.far) : null; });
toggle("motion", "motion", () => {});
for (const L of LAYERS) { const b = document.createElement("button"); b.textContent = L.name; b.title = "show/hide the " + L.name + " layer";
  b.setAttribute("aria-pressed", String(L.on));
  b.addEventListener("click", () => { L.on = !L.on; b.setAttribute("aria-pressed", String(L.on)); if (L.mesh) L.mesh.visible = L.on; });

function resize() {
